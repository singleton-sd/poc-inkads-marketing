backend:
  name: github
  repo: singleton-sd/poc-inkads-marketing
  branch: main
  # Shared Decap OAuth proxy (cms-oauth-kit, https://auth.singletonsd.com)
  base_url: https://auth.singletonsd.com
  auth_endpoint: auth

publish_mode: editorial_workflow

site_url: https://inkads.poc.singletonsd.com
display_url: https://inkads.poc.singletonsd.com

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: Page title (browser tab / SEO).
      - label: Description
        name: description
        widget: text
        required: false
        hint: Short meta description for SEO.
      - label: Brand
        name: brand
        widget: string
        required: false
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: false
      - label: Headline
        name: headline
        widget: string
      - label: Summary
        name: summary
        widget: text
      - label: CTA title
        name: ctaTitle
        widget: string
        required: false
      - label: CTA label
        name: ctaLabel
        widget: string
        required: false
      - label: CTA URL
        name: ctaHref
        widget: string
        required: false
      - label: Last updated
        name: updated
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown

  - name: faqs
    label: FAQ items
    label_singular: FAQ item
    folder: src/content/faqs
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Question
        name: question
        widget: string
      - label: Answer
        name: answer
        widget: text
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 0
      - label: Inline link
        name: link
        widget: object
        required: false
        hint: Optional label matched inside the answer (for example Pricing).
        fields:
          - label: Label
            name: label
            widget: string
          - label: URL
            name: href
            widget: string
      - label: Draft
        name: draft
        widget: boolean
        default: false

  - name: legal
    label: Legal pages
    label_singular: Legal page
    folder: src/content/legal
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Effective date
        name: effectiveDate
        widget: datetime
        time_format: false
      - label: Draft
        name: draft
        widget: boolean
        default: true
      - label: Body
        name: body
        widget: markdown
