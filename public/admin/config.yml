            required: false
          - label: CTA label
            name: ctaLabel
            widget: string
            required: false
          - label: Media placeholder label
            name: mediaLabel
            widget: string
            required: false
          - label: Benefits eyebrow
            name: benefitsEyebrow
            widget: string
            required: false
          - label: Benefits
            name: benefits
            widget: list
            required: false
            fields:
              - { label: Title, name: title, widget: string }
