  - name: faqs
    label: FAQ items
    label_singular: FAQ item
    folder: src/content/faqs
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Question
        name: question
        widget: string
      - label: Answer
        name: answer
        widget: text
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 0
      - label: Inline link
        name: link
        widget: object
        required: false
        hint: Optional label matched inside the answer (for example Pricing).
        fields:
          - label: Label
            name: label
            widget: string
          - label: URL
            name: href
            widget: string
      - label: Draft
        name: draft
        widget: boolean
        default: false

  - name: legal
    label: Legal pages
    label_singular: Legal page
    folder: src/content/legal
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Effective date
        name: effectiveDate
        widget: datetime
        time_format: false
      - label: Draft
        name: draft
        widget: boolean
        default: true
      - label: Body
        name: body
        widget: markdown
