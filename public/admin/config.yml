backend:
  name: github
  repo: singleton-sd/poc-inkads-marketing
  branch: main
  # Shared Decap OAuth proxy (cms-oauth-kit, https://auth.singletonsd.com)
  base_url: https://auth.singletonsd.com
  auth_endpoint: auth

publish_mode: editorial_workflow

site_url: https://inkads.poc.singletonsd.com
display_url: https://inkads.poc.singletonsd.com

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: Page title (browser tab / SEO).
      - label: Description
        name: description
        widget: text
        required: false
        hint: Short meta description for SEO.
      - label: Brand
        name: brand
        widget: string
        required: false
      - label: Headline
        name: headline
        widget: string
        required: false
      - label: Summary
        name: summary
        widget: text
        required: false
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: false
      - label: CTA label
        name: ctaLabel
        widget: string
        required: false
      - label: CTA URL
        name: ctaUrl
        widget: string
        required: false
      - label: Media label
        name: mediaLabel
        widget: string
        required: false
      - label: Benefits eyebrow
        name: benefitsEyebrow
        widget: string
        required: false
      - label: Benefits
        name: benefits
        widget: list
        required: false
        fields:
          - label: Title
            name: title
            widget: string
          - label: Description
            name: description
            widget: text
      - label: Designing eyebrow
        name: designingEyebrow
        widget: string
        required: false
      - label: Designing headline
        name: designingHeadline
        widget: string
        required: false
      - label: Designing body
        name: designingBody
        widget: text
        required: false
      - label: Closing headline
        name: closingHeadline
        widget: string
        required: false
      - label: Last updated
        name: updated
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown

  - name: legal
    label: Legal pages
    label_singular: Legal page
    folder: src/content/legal
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Effective date
        name: effectiveDate
        widget: datetime
        time_format: false
      - label: Draft
        name: draft
        widget: boolean
        default: true
      - label: Body
        name: body
        widget: markdown
