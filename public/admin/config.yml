backend:
  name: github
  repo: singleton-sd/poc-inkads-marketing
  branch: main
  # Shared Decap OAuth proxy (cms-oauth-kit, https://auth.singletonsd.com)
  base_url: https://auth.singletonsd.com
  auth_endpoint: auth

publish_mode: editorial_workflow

site_url: https://inkads.poc.singletonsd.com
display_url: https://inkads.poc.singletonsd.com

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    files:
      - label: About
        file: src/content/pages/about.md
        name: about
        fields:
          - label: Template
            name: template
            widget: hidden
            default: about
          - label: Title
            name: title
            widget: string
            hint: Page title (browser tab / SEO).
          - label: Description
            name: description
            widget: text
            hint: Short meta description for SEO.
          - label: Headline
            name: headline
            widget: string
          - label: Summary
            name: summary
            widget: text
            hint: Hero lead / supporting sentence.
          - label: Eyebrow
            name: eyebrow
            widget: string
            required: false
          - label: Columns
            name: columns
            widget: list
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Body, name: body, widget: text }
          - label: Parent brand copy
            name: parentBrand
            widget: text
          - label: CTA title
            name: ctaTitle
            widget: string
          - label: Primary CTA
            name: primaryCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - {
                  label: URL,
                  name: href,
                  widget: select,
                  options:
                    [
                      /,
                      /how-it-works,
                      /places,
                      /venues,
                      /advertisers,
                      /pricing,
                      /about,
                      /faq,
                      /support,
                      /contact,
                    ],
                }
          - label: Secondary CTA
            name: secondaryCta
            widget: object
            fields:
              - { label: Label, name: label, widget: string }
              - {
                  label: URL,
                  name: href,
                  widget: select,
                  options:
                    [
                      /,
                      /how-it-works,
                      /places,
                      /venues,
                      /advertisers,
                      /pricing,
                      /about,
                      /faq,
                      /support,
                      /contact,
                    ],
                }
          - label: Draft
            name: draft
            widget: boolean
            required: false
            default: false
          - label: Body
            name: body
            widget: markdown
      - label: Advertisers
        file: src/content/pages/advertisers.md
        name: advertisers
        fields:
