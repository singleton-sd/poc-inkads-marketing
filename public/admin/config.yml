backend:
  name: github
  repo: singleton-sd/poc-inkads-marketing
  branch: main
  # Shared Decap OAuth proxy (cms-oauth-kit, https://auth.singletonsd.com)
  base_url: https://auth.singletonsd.com
  auth_endpoint: auth

publish_mode: editorial_workflow

site_url: https://inkads.poc.singletonsd.com
display_url: https://inkads.poc.singletonsd.com

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: Page title (browser tab / SEO).
      - label: Description
        name: description
        widget: text
        required: false
        hint: Short meta description for SEO.
      - label: Summary
        name: summary
        widget: text
        hint: Hero lead / supporting sentence.
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: false
      - label: Brand
        name: brand
        widget: string
        required: false
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: false
      - label: Headline
        name: headline
        widget: string
      - label: Columns
        name: columns
        widget: list
        required: false
        hint: About page only.
        fields:
          - label: Title
            name: title
            widget: string
            required: true
          - label: Body
            name: body
            widget: text
            required: true
      - label: Parent brand copy
        name: parentBrand
        widget: text
        required: false
        hint: About page only.
      - label: CTA title
        name: ctaTitle
        widget: string
        required: false
      - label: Primary CTA label
        name: primaryCta
        widget: object
        required: false
        fields:
          - label: Label
            name: label
            widget: string
            required: true
          - label: URL
            name: href
            widget: string
            required: true
      - label: Secondary CTA
        name: secondaryCta
        widget: object
        required: false
        fields:
          - label: Label
            name: label
            widget: string
            required: true
          - label: URL
            name: href
            widget: string
            required: true
      - label: CTA label
        name: ctaLabel
        widget: string
        required: false
      - label: CTA URL
        name: ctaHref
        widget: string
        required: false
      - label: Media placeholder label
        name: mediaLabel
        widget: string
        required: false
      - label: Benefits eyebrow
        name: benefitsEyebrow
        widget: string
        required: false
      - label: Benefits
        name: benefits
        widget: list
        required: false
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
      - label: Process eyebrow
        name: processEyebrow
        widget: string
        required: false
      - label: Process headline
        name: processHeadline
        widget: string
        required: false
      - label: Process steps
        name: process
        widget: list
        required: false
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Detail, name: detail, widget: text }
      - label: Closing headline
        name: closingHeadline
        widget: string
        required: false
      - label: Designing eyebrow
        name: designingEyebrow
        widget: string
        required: false
      - label: Designing headline
        name: designingHeadline
        widget: string
        required: false
      - label: Designing body
        name: designingBody
        widget: text
        required: false
      - label: Last updated
        name: updated
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown

  - name: faqs
    label: FAQ items
    label_singular: FAQ item
    folder: src/content/faqs
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Question
        name: question
        widget: string
      - label: Answer
        name: answer
        widget: text
      - label: Order
        name: order
        widget: number
        value_type: int
        min: 0
      - label: Inline link
        name: link
        widget: object
        required: false
        hint: Optional label matched inside the answer (for example Pricing).
        fields:
          - label: Label
            name: label
            widget: string
          - label: URL
            name: href
            widget: string
      - label: Draft
        name: draft
        widget: boolean
        default: false

  - name: legal
    label: Legal pages
    label_singular: Legal page
    folder: src/content/legal
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Effective date
        name: effectiveDate
        widget: datetime
        time_format: false
      - label: Draft
        name: draft
        widget: boolean
        default: true
      - label: Body
        name: body
        widget: markdown
