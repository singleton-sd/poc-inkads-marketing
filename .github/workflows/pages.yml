# Production site from main onto the gh-pages branch root.
#
# Build is unauthenticated (contents: read, no secrets). Deploy downloads dist,
# then mints the singleton-release App token as its last setup step and deploys
# with that token only — never GITHUB_TOKEN.
name: Deploy production GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint and type-check
        run: pnpm lint
      - name: Run tests
        run: pnpm test
      - name: Require Turnstile site key
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "${PUBLIC_TURNSTILE_SITE_KEY:-}" ]; then
            echo "::error::Set repository variable PUBLIC_TURNSTILE_SITE_KEY (public site key only)."
            exit 1
          fi
      - name: Build production site
        run: pnpm build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Install Playwright browsers
        run: pnpm playwright:install

      - name: SEO metadata checks
        run: pnpm test:seo

      - name: Accessibility checks
        run: pnpm test:a11y

      - name: Upload production site
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download production site
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: poc-inkads-marketing
          permission-contents: write
      - name: Deploy production site
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: pr-preview
