name: Deploy pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pages-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        if: github.event.action != 'closed'
        run: pnpm format:check
      - name: Lint and type-check
        if: github.event.action != 'closed'
        run: pnpm lint
      - name: Run tests
        if: github.event.action != 'closed'
        run: pnpm test
      - name: Build preview site
        if: github.event.action != 'closed'
        run: pnpm build
        env:
          PREVIEW_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
      - name: Install Playwright browsers
        if: github.event.action != 'closed'
        run: pnpm playwright:install
      - name: Capture visual screenshots
        if: github.event.action != 'closed'
        run: pnpm test:visual
        env:
          VISUAL_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
      - name: Upload visual screenshots
        if: github.event.action != 'closed'
        uses: actions/upload-artifact@v4
        with:
          name: visual-pr-${{ github.event.number }}
          path: test-results/visual
          if-no-files-found: error
          retention-days: 14
      - name: Deploy or remove preview
        id: preview
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://inkads.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false
      - name: Post sticky preview comment
        if: github.event.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: inkads-preview
          recreate: true
          message: |
            ## Preview

            🔗 **[Open live preview](https://inkads.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/)**

            - URL: `https://inkads.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/`
            - Visual review: download the `visual-pr-${{ github.event.number }}` artifact from this workflow run, then open `index.html`
            - Artifact layout: `base/` (production before) · `pr/` (this branch) · `diff/` (pixel changes)
      - name: Hide sticky preview comment
        if: github.event.action == 'closed'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: inkads-preview
          hide: true
      - name: Update preview link in pull request body
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: https://inkads.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/
          PREVIEW_REMOVED: ${{ github.event.action == 'closed' }}
        with:
          script: |
            const markerStart = "<!-- inkads-preview:start -->";
            const markerEnd = "<!-- inkads-preview:end -->";
            const managedBlock = new RegExp(
              `${markerStart}[\\s\\S]*?${markerEnd}\\n*`,
              "m",
            );
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const currentBody = pull.data.body ?? "";
            const bodyWithoutPreview = currentBody.replace(managedBlock, "").trim();
            const previewBlock = [
              markerStart,
              "## Preview",
              "",
              `🔗 **[Open live preview](${process.env.PREVIEW_URL})**`,
              "",
              `Visual review: download workflow artifact \`visual-pr-${context.issue.number}\` and open \`index.html\` (\`base/\` vs \`pr/\` vs \`diff/\`).`,
              markerEnd,
            ].join("\n");
            const body = process.env.PREVIEW_REMOVED === "true"
              ? bodyWithoutPreview
              : `${previewBlock}${bodyWithoutPreview ? `\n\n${bodyWithoutPreview}` : ""}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body,
            });
