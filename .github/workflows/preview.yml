name: Deploy pull request preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed, labeled, unlabeled]

# Per-PR groups so queued previews are not cancelled when many PRs update at
# once (a shared pages-publish group drops previously pending runs). Label
# accept stays on its own group. cancel-in-progress only replaces stale runs
# for the same PR. Parallel gh-pages pushes get a second deploy attempt below.
concurrency:
  group: ${{ contains(fromJSON('["labeled","unlabeled"]'), github.event.action) && format('visual-label-pr-{0}', github.event.number) || format('preview-pr-{0}', github.event.number) }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  preview:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["opened","reopened","synchronize"]'), github.event.action)
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.urls.outputs.preview_url }}
      visual_url: ${{ steps.urls.outputs.visual_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set preview URLs
        id: urls
        run: |
          echo "preview_url=https://inkads.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/" >> "$GITHUB_OUTPUT"
          echo "visual_url=https://inkads.poc.singletonsd.com/pr-preview/pr-${{ github.event.number }}/visual/" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint and type-check
        run: pnpm lint
      - name: Run tests
        run: pnpm test
      - name: Check out PR base for visual baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: visual-base
      - name: Install baseline dependencies
        working-directory: visual-base
        run: pnpm install --frozen-lockfile
      - name: Build visual baseline
        working-directory: visual-base
        run: pnpm build
      - name: Build PR site for visual compare
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm playwright:install
      - name: Capture visual screenshots
        run: pnpm test:visual
        env:
          VISUAL_BASE_PATH: /
          VISUAL_BASE_DIR: ${{ github.workspace }}/visual-base/dist
      - name: Build preview site
        run: pnpm build
        env:
          PREVIEW_BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
      - name: Host visual report under preview
        run: |
          rm -rf dist/visual
          cp -R test-results/visual dist/visual
      - name: Upload visual screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-pr-${{ github.event.number }}
          path: test-results/visual
          if-no-files-found: error
          retention-days: 14
      # pr-preview-action is composite; wretry cannot wrap it. Retry push races
      # against production / other previews with a second attempt.
      - name: Deploy preview
        id: preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://inkads.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false
      - name: Retry deploy preview
        if: steps.preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://inkads.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false
      - name: Build sticky preview comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.urls.outputs.preview_url }}
          VISUAL_URL: ${{ steps.urls.outputs.visual_url }}
        with:
          script: |
            const fs = require("node:fs");
            const manifest = JSON.parse(
              fs.readFileSync("test-results/visual/manifest.json", "utf8"),
            );
            const summary = manifest.summary ?? {
              changed: 0,
              new: 0,
              unchanged: 0,
              changedRoutes: [],
              newRoutes: [],
              hasDiffs: false,
            };
            const changedList =
              summary.changedRoutes?.length > 0
                ? summary.changedRoutes.map((r) => `\`${r}\``).join(", ")
                : "—";
            const newList =
              summary.newRoutes?.length > 0
                ? summary.newRoutes.map((r) => `\`${r}\``).join(", ")
                : "—";
            const statusLine = summary.hasDiffs
              ? `⚠️ Visual diffs detected (${summary.changed} changed routes, ${summary.new} new vs PR base). The **visual** check fails until you add the \`visual-accepted\` label (no rebuild — that label alone clears the check).`
              : "✅ No visual diffs vs PR base branch.";
            const body = [
              "## Preview",
              "",
              `🔗 **[Open live preview](${process.env.PREVIEW_URL})**`,
              "",
              `🖼️ **[Open visual report](${process.env.VISUAL_URL})** (base vs PR vs diff)`,
              "",
              statusLine,
              "",
              `- Changed routes: ${changedList}`,
              `- New routes: ${newList}`,
              `- Unchanged viewports: ${summary.unchanged ?? 0}`,
              `- Artifact backup: \`visual-pr-${context.issue.number}\``,
              "",
            ].join("\n");
            fs.writeFileSync("preview-comment.md", body);
      - name: Post sticky preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: inkads-preview
          recreate: true
          path: preview-comment.md
      - name: Update preview link in pull request body
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.urls.outputs.preview_url }}
          VISUAL_URL: ${{ steps.urls.outputs.visual_url }}
        with:
          script: |
            const markerStart = "<!-- inkads-preview:start -->";
            const markerEnd = "<!-- inkads-preview:end -->";
            const managedBlock = new RegExp(
              `${markerStart}[\\s\\S]*?${markerEnd}\\n*`,
              "m",
            );
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const currentBody = pull.data.body ?? "";
            const bodyWithoutPreview = currentBody.replace(managedBlock, "").trim();
            const previewBlock = [
              markerStart,
              "## Preview",
              "",
              `🔗 **[Open live preview](${process.env.PREVIEW_URL})**`,
              "",
              `🖼️ **[Open visual report](${process.env.VISUAL_URL})**`,
              markerEnd,
            ].join("\n");
            const body = `${previewBlock}${bodyWithoutPreview ? `\n\n${bodyWithoutPreview}` : ""}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body,
            });

  visual:
    name: visual
    needs: [preview]
    if: >
      always() &&
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed' &&
      (
        needs.preview.result == 'success' ||
        (
          needs.preview.result == 'skipped' &&
          contains(fromJSON('["labeled","unlabeled"]'), github.event.action) &&
          github.event.label.name == 'visual-accepted'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Detect visual-accepted label
        id: accept
        uses: actions/github-script@v8
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const accepted = labels.some((l) => l.name === "visual-accepted");
            core.setOutput("accepted", accepted ? "true" : "false");
            if (accepted) {
              core.info("Label visual-accepted is present; gate will pass without rebuild.");
            }
      - name: Accept intentional visual diffs
        if: steps.accept.outputs.accepted == 'true'
        run: |
          echo "visual-accepted label present — clearing the visual check (no rebuild or re-screenshot)."
      - name: Download visual artifact from this run
        if: steps.accept.outputs.accepted != 'true' && needs.preview.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: visual-pr-${{ github.event.number }}
          path: test-results/visual
      - name: Download latest visual artifact for this PR
        if: steps.accept.outputs.accepted != 'true' && needs.preview.result == 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ARTIFACT="visual-pr-${{ github.event.number }}"
          ID=""
          for _ in $(seq 1 12); do
            ID="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT}&per_page=20" \
              --jq --arg sha "$HEAD_SHA" \
              '[.artifacts[] | select(.expired==false and .workflow_run.head_sha==$sha)][0].id // empty')"
            if [ -n "$ID" ]; then
              break
            fi
            echo "No ${ARTIFACT} artifact for ${HEAD_SHA} yet; waiting for preview capture..."
            sleep 20
          done
          if [ -z "$ID" ]; then
            echo "No ${ARTIFACT} artifact for head ${HEAD_SHA}. Push a commit so preview can capture visuals first."
            exit 1
          fi
          mkdir -p test-results/visual
          gh api "repos/${{ github.repository }}/actions/artifacts/${ID}/zip" > /tmp/visual.zip
          unzip -o /tmp/visual.zip -d test-results/visual
          # Prefer gate against this SHA only (avoid stale production-baseline artifacts).
          echo "Using artifact ${ID} for ${HEAD_SHA}"
          python3 - <<'PY'
          import json, pathlib
          manifest = json.loads(pathlib.Path("test-results/visual/manifest.json").read_text())
          summary = manifest.get("summary") or {}
          print(
              f"Artifact summary: changed={summary.get('changed')} new={summary.get('new')} "
              f"hasDiffs={summary.get('hasDiffs')} baseLabel={manifest.get('baseLabel')}"
          )
          PY
      - name: Set up Node.js
        if: steps.accept.outputs.accepted != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run visual gate
        if: steps.accept.outputs.accepted != 'true'
        run: node tests/visual-gate.mjs

  cleanup:
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Remove preview
        id: remove_preview
        continue-on-error: true
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://inkads.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false
      - name: Retry remove preview
        if: steps.remove_preview.outcome == 'failure'
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: dist
          preview-branch: gh-pages
          pages-base-url: https://inkads.poc.singletonsd.com
          umbrella-dir: pr-preview
          comment: false
      - name: Hide sticky preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: inkads-preview
          hide: true
      - name: Remove preview block from pull request body
        uses: actions/github-script@v8
        with:
          script: |
            const markerStart = "<!-- inkads-preview:start -->";
            const markerEnd = "<!-- inkads-preview:end -->";
            const managedBlock = new RegExp(
              `${markerStart}[\\s\\S]*?${markerEnd}\\n*`,
              "m",
            );
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const currentBody = pull.data.body ?? "";
            const body = currentBody.replace(managedBlock, "").trim();
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body,
            });
