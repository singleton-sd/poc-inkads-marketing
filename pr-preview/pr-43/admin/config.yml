backend:
  name: github
  repo: singleton-sd/poc-inkads-marketing
  branch: main
  # Shared Decap OAuth proxy (cms-oauth-kit, https://auth.singletonsd.com)
  base_url: https://auth.singletonsd.com
  auth_endpoint: auth

publish_mode: editorial_workflow

site_url: https://inkads.poc.singletonsd.com
display_url: https://inkads.poc.singletonsd.com

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: Page title (browser tab / SEO).
      - label: Description
        name: description
        widget: text
        required: false
        hint: Short meta description for SEO.
      - label: Eyebrow
        name: eyebrow
        widget: string
        required: false
      - label: Brand
        name: brand
        widget: string
        required: false
      - label: Headline
        name: headline
        widget: string
        required: false
      - label: Summary
        name: summary
        widget: text
        required: true
      - label: Columns
        name: columns
        widget: list
        required: true
        fields:
          - label: Title
            name: title
            widget: string
            required: true
          - label: Body
            name: body
            widget: text
            required: true
      - label: Parent brand copy
        name: parentBrand
        widget: text
        required: true
      - label: CTA title
        name: ctaTitle
        widget: string
        required: true
      - label: Primary CTA label
        name: primaryCta
        widget: object
        required: true
        fields:
          - label: Label
            name: label
            widget: string
            required: true
          - label: URL
            name: href
            widget: string
            required: true
      - label: Secondary CTA
        name: secondaryCta
        widget: object
        required: true
        fields:
          - label: Label
            name: label
            widget: string
            required: true
          - label: URL
            name: href
            widget: string
            required: true
      - label: CTA label
        name: ctaLabel
        widget: string
        required: false
      - label: CTA URL
        name: ctaUrl
        widget: string
        required: false
      - label: Last updated
        name: updated
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown

  - name: legal
    label: Legal pages
    label_singular: Legal page
    folder: src/content/legal
    create: true
    delete: false
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Effective date
        name: effectiveDate
        widget: datetime
        time_format: false
      - label: Draft
        name: draft
        widget: boolean
        default: true
      - label: Body
        name: body
        widget: markdown
