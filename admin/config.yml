backend:
  name: github
  repo: singleton-sd/poc-inkads-marketing
  branch: main

# GitHub Pages cannot run the OAuth callback required by this backend.
# Login remains unavailable until an external OAuth integration is deployed;
# see docs/editorial.md before configuring base_url and auth_endpoint here.
publish_mode: editorial_workflow
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: pages
    label: Landing pages
    label_singular: Landing page
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Headline, name: headline, widget: string }
      - { label: Summary, name: summary, widget: text }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown, required: false }

  - name: legal
    label: Legal pages
    label_singular: Legal page
    folder: src/content/legal
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - {
          label: Effective date,
          name: effectiveDate,
          widget: datetime,
          time_format: false,
        }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: Body, name: body, widget: markdown }
